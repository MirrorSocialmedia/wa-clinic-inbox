name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # ★ cwi-qa FX-01（QA-01）：job 級 timeout — 舊 run 卡 unit 唔退出 6 小時（unit-reminder/session-engine
    #   冇 process.exit + BullMQ queue 連接 keep event loop 活著）；240 分鐘上限兜底。
    timeout-minutes: 240
    services:
      # ★ cwi-qa FX-01（QA-01）：health-cmd 必係單 token（pg_isready）— options 由 GitHub 按空白
      #   拆 token 傳 docker create（無 shell 層）：多詞命令（例 'pg_isready -U postgres'）會拆出
      #   unknown flag: -U → Initialize containers 14s 即紅（實測 run 36424082016）。pg_isready
      #   唔做 auth（收到任何 server response 即 ready）→ 單 token 就夠；main 實測 4 連綠
      #   （36300671621 / 36315857764 / 36352735331 / 36378302792，35–43s）。
      postgres: { image: postgres:16, env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: wa }, ports: ["15432:5432"], options: "--health-cmd pg_isready --health-interval 5s --health-retries 10" }
      redis: { image: redis:7, ports: ["6379:6379"], options: "--health-cmd redis-cli --health-interval 5s --health-retries 10" }
    env:
      DATABASE_URL: "postgresql://postgres:pw@localhost:15432/wa?connection_limit=15&pool_timeout=10"
      REDIS_URL: redis://localhost:6379
      AI_MOCK: "1"
      WA_MOCK: "1"
      DUTY_MOCK: "1"
      ALLOW_MOCK_IN_PROD: "1"
      RETENTION_CONV_MONTHS: "24"
      RETENTION_MEDIA_MONTHS: "12"
      # S6-1 deviation（記錄在案）：runner 無 ms-playwright registry → 指 system chrome
      #（spec S6-1「executablePath 讀 env PW_CHROMIUM（冇就用 playwright 預設）」機制；
      #   mock-e2e.sh --ci 內嘅 browser e2e 經 scripts/_pw.ts chromiumPath() 消費呢個 env）
      PW_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # ★ cwi-qa FX-01b：確保 redis-cli client 喺 job 容器（runner image 無 redis-tools 就裝）
      #   mock-e2e --ci [0/9] 用 redis-cli ping 探活；service 已加 health-cmd 保證 ready
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:deploy && pnpm db:seed
      # ★ cwi-qa FX-01 臨時：全新 DB seed 出嘅 ADMIN 係空範圍（scopeType default CLINICS + 零 StaffClinic）
      #   → mock-e2e T19 等 global-admin case 403。根因修 = FX-02（階段 2，seed 帶 scopeType: ALL）—
      #   ⚠️ FX-02 上線後刪呢行（階段 2 Lane A 任務）。
      #   URL 去 query params（connection_limit/pool_timeout 係 Prisma 專用 — psql 唔識）。
      - run: psql "${DATABASE_URL%%\?*}" -c "UPDATE \"StaffUser\" SET \"scopeType\"='ALL' WHERE email='admin@wa-clinic.local';"
      # ★ cwi-qa FX-01b（run 36425409185 step 10 實測）：unit-knowledge 前置 = TKW 知識庫骨架
      #   （scripts/seed-knowledge.ts，44 條，冪等；unit 檔頭明載「TKW 需已 seed」）— fresh DB 冇跑
      #   過 → pickKnowledge 5 項全紅。本地 dev DB 係歷史跑過，所以本機綠 / CI 紅。
      - run: pnpm tsx scripts/seed-knowledge.ts
      # ★ cwi-qa（run #8 實錚 36527615294）：J 段 e2e-s21 斷言 seed 契約 = global E rule
      #   （FollowupRule trigger=QUOTED_NOT_BOOKED enabled）— seed-followup-p4.ts 專責建立（idempotent upsert）
      #   但 ci.yml 從來冇跑 → fresh DB 冇 E rule → J 段 FATAL → 下游 pipeline cascade（push/T680/T693 全死）。
      #   本地 dev DB 係歷史跑過所以本機綠 — 同 FX-01b knowledge seed 同類「舊 DB 假綠」。
      - run: pnpm tsx scripts/seed-followup-p4.ts
      - run: pnpm typecheck && pnpm lint
      # ★ cwi-qa FX-01（QA-01）：每個 unit 加 timeout 150 — 舊 run unit 卡死會吊住成個 job 6 小時；
      #   150s 夠最快 unit（company-sync ~30s）冷 runner 跑完，卡死個直接 kill → 清晰失敗。
      - run: for f in scripts/unit-*.ts; do timeout 150 pnpm tsx "$f" || exit 1; done
      - run: pnpm test:ordering
      - run: pnpm tsx scripts/e2e-authz-matrix.ts   # T630
      - run: bash scripts/mock-e2e.sh --ci
